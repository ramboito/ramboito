<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>통계 대시보드 | 해밀푸드</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 11 13.75 12 12.5"/></svg></span>
      <span>해밀푸드<span class="logo-sub">HAMIL FOOD</span></span>
    </a>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container ledger-header">
      <div>
        <div class="breadcrumb">홈 / <span>통계 대시보드</span></div>
        <h1>매출·수입·수출 통계</h1>
      </div>
      <div class="ledger-user">
        <span id="dash-user" style="color:#fff; font-weight:700;"></span> 님으로 로그인됨
        &nbsp;·&nbsp;
        <a href="ledger.html" style="color:#fff; text-decoration:underline;">📒 장부 입력</a>
        &nbsp;·&nbsp;
        <a href="#" id="dash-logout" style="color:#fff; text-decoration:underline;">로그아웃</a>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <div class="dash-toolbar">
        <label for="dash-period">기간</label>
        <select id="dash-period">
          <option value="this-month" selected>이번 달</option>
          <option value="last-month">지난 달</option>
          <option value="this-year">올해</option>
          <option value="all">전체</option>
        </select>
      </div>

      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="dash-card-grid">
        <div class="dash-card">
          <div class="dash-card-title"><h2>월별 추이 (최근 12개월)</h2></div>
          <div id="trend-chart" class="chart-box"></div>
          <div class="legend" id="trend-legend"></div>
        </div>

        <div class="dash-card">
          <div class="dash-card-title">
            <h2>지출 항목 비중</h2>
            <span class="dash-card-sub" id="expense-breakdown-period"></span>
          </div>
          <div id="donut-chart" class="chart-box"></div>
          <div class="legend" id="donut-legend"></div>
        </div>
      </div>

      <div class="ledger-table-wrap" style="margin-top:0;">
        <table class="ledger-table">
          <thead>
            <tr>
              <th>날짜</th>
              <th>구분</th>
              <th>항목</th>
              <th>금액</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody id="recent-tbody"></tbody>
        </table>
        <p id="recent-empty" class="ledger-empty">아직 등록된 거래가 없습니다.</p>
      </div>

    </div>
  </section>
</main>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
