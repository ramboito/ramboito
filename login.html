<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 | 해밀푸드</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 11 13.75 12 12.5"/></svg></span>
      <span>해밀푸드<span class="logo-sub">HAMIL FOOD</span></span>
    </a>
  </div>
</header>

<main>
  <div class="login-wrap">
    <div class="login-card">
      <a href="index.html" class="logo">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 11 13.75 12 12.5"/></svg></span>
      </a>
      <h1>내부 장부 로그인</h1>

      <form id="login-form" novalidate>
        <div class="field" style="margin-bottom:16px;">
          <label for="login-id">아이디</label>
          <input type="text" id="login-id" name="login-id" autocomplete="username" required />
        </div>
        <div class="field" style="margin-bottom:20px;">
          <label for="login-password">비밀번호</label>
          <input type="password" id="login-password" name="login-password" autocomplete="current-password" required />
        </div>

        <p id="login-error" class="login-error"></p>

        <button type="submit" id="login-submit" class="btn btn-primary" style="width:100%; margin-top:8px;">로그인</button>
      </form>
    </div>
  </div>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
